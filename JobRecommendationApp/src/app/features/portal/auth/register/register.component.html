<div class="card max-w-md mx-auto mt-8">
  <h1 class="page-title text-center mb-6">สมัครสมาชิก</h1>

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="form-label">เลือกประเภทผู้ใช้งาน</label>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" (click)="role = 'JobSeeker'"
                [class.btn-outline-active]="role === 'JobSeeker'"
                class="btn-outline">
          ผู้หางาน
        </button>
        <button type="button" (click)="role = 'Employer'"
                [class.btn-outline-active]="role === 'Employer'"
                class="btn-outline">
          ผู้ประกอบการ
        </button>
      </div>
    </div>

    <div>
      <label class="form-label">ชื่อผู้ใช้</label>
      <input 
            type="text" 
            name="username" 
            [(ngModel)]="username"
            placeholder="ชื่อผู้ใช้" 
            required class="form-input" />
    </div>

    <div>
      <label class="form-label">อีเมล</label>
      <input 
          type="email" 
          name="email" 
          [(ngModel)]="email"
          required
          placeholder="อีเมลของคุณ" 
          class="form-input" />
    </div>

    <div>
      <label class="form-label">รหัสผ่าน</label>
      <input 
            type="password" 
            name="password" 
            [(ngModel)]="password"
            required minlength="8"
            placeholder="รหัสผ่านอย่างน้อย 8 ตัวอักษร" 
            class="form-input" />
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="form-success">{{ successMessage() }}</p>
    }

    <button type="submit" [disabled]="isSubmitting()" class="btn-primary btn-block">
      {{ isSubmitting() ? 'กำลังสมัคร...' : 'สมัครสมาชิก' }}
    </button>
  </form>

  <p class="text-sm text-muted mt-4 text-center">
    มีบัญชีอยู่แล้ว? <a routerLink="/login" class="text-brand-600 hover:underline">เข้าสู่ระบบ</a>
  </p>
</div>
