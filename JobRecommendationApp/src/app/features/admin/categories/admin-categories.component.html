<div>
  <div class="flex items-center justify-between mb-6">
    <h1 class="page-title mb-0">หมวดหมู่งาน</h1>
    <div class="flex gap-2">

      <button mat-flat-button color="primary" 
      (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        เพิ่ม
      </button>

      <button mat-flat-button color="accent" 
      [disabled]="!selectedCategory"
      (click)="openEditDialog(selectedCategory!)">
        <mat-icon>edit</mat-icon>
        เเก้ไข
      </button>

      <button mat-flat-button color="warn"
      [disabled]="!selectedCategory"
      (click)="deleteCategory(selectedCategory!)">
        <mat-icon>delete</mat-icon>
        ลบ
      </button>
    </div>
  </div>

  @if (isLoading()) {
  <mat-spinner diameter="32"></mat-spinner>
  } @else if (categories().length === 0) {
  <p class="text-muted">ยังไม่มีหมวดหมู่งาน</p>
  } @else {
 <table mat-table [dataSource]="categories()" class="w-full card p-0 overflow-hidden">
    
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>ชื่อหมวดหมู่</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

     <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        (click)="selectCategory(row)"
        [class.selected-row]="selectedCategory?.id === row.id"
        class="cursor-pointer hover:bg-gray-50 transition-colors">
      </tr>
    </table>
  }
</div>
